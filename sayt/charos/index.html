<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Charos uchun maxsus romantik tabrik" />
  <title>Charos ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app">
  <!-- Background layers -->
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="gradient-overlay" aria-hidden="true"></div>
  <div class="particles-layer" id="particlesLayer" aria-hidden="true"></div>
  <div class="sparkles-layer" id="sparklesLayer" aria-hidden="true"></div>
  <div class="petals-layer" id="petalsLayer" aria-hidden="true"></div>
  <div class="mouse-hearts" id="mouseHearts" aria-hidden="true"></div>
  <div class="floating-hearts-layer" id="floatingHeartsLayer" aria-hidden="true"></div>

  <!-- Opening scene -->
  <section class="scene scene--opening" id="openingScene">
    <div class="scene-vignette" aria-hidden="true"></div>

    <div class="decor-hearts" aria-hidden="true">
      <span class="decor-heart decor-heart--1">❤</span>
      <span class="decor-heart decor-heart--2">♥</span>
      <span class="decor-heart decor-heart--3">❤</span>
      <span class="decor-heart decor-heart--4">♥</span>
      <span class="decor-heart decor-heart--5">❤</span>
      <span class="decor-heart decor-heart--6">♥</span>
      <span class="decor-heart decor-heart--7">❤</span>
      <span class="decor-heart decor-heart--8">♥</span>
    </div>

    <div class="envelope-wrapper" id="envelopeWrapper">
      <div class="envelope-glow" id="envelopeGlow" aria-hidden="true"></div>
      <div class="magic-light" id="magicLight" aria-hidden="true"></div>

      <div class="envelope-3d" id="envelope">
        <div class="envelope__shadow"></div>
        <div class="envelope__body">
          <div class="envelope__back"></div>
          <div class="envelope__letter" id="envelopeLetter">
            <div class="letter-shine"></div>
          </div>
          <div class="envelope__pocket"></div>
          <div class="envelope__flap" id="envelopeFlap">
            <div class="flap-inner"></div>
          </div>
          <div class="envelope__front-left"></div>
          <div class="envelope__front-right"></div>
          <div class="envelope__seal" id="envelopeSeal">
            <span>❤</span>
          </div>
        </div>
        <p class="envelope__text">1-IYUN BOLALAR KUNI BILAN TABRIKLAYMAN ❤️</p>
      </div>

      <div class="burst-hearts" id="burstHearts" aria-hidden="true"></div>
    </div>

    <button type="button" class="open-btn" id="openBtn" aria-label="Xatni ochish">
      <span class="open-btn__shine"></span>
      <span class="open-btn__text">💌 Xatni ochish</span>
    </button>
  </section>

  <!-- Love message scene -->
  <section class="scene scene--message hidden" id="messageScene" aria-live="polite">
    <div class="message-glass">
      <h1 class="message-title" id="messageTitle">
        <span class="title-charos">Charos</span>
        <span class="title-heart">❤️</span>
      </h1>
      <p class="message-typewriter" id="typewriterText"></p>
      <span class="typewriter-cursor" id="typewriterCursor" aria-hidden="true">|</span>
    </div>
  </section>

  <audio id="bgMusic" preload="auto" loop>
    <source src="vafodorim.mp3" type="audio/mpeg" />
  </audio>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
